    content: "Spawn dünyası, /spawn ile gelinir PvP: kapalı, Grief: kapalı."
  - title: "Dünya: Survival"
    content: "Ana survival dünyası, /rtp ile gelinir PvP: açık, Grief: açık."
  - title: "Dünya: PvP Arena"
    content: "Oyuncular arası savaş bölgesi, /warp arena PvP: açık, Grief: kapalı."
  - title: "Dünya: Madenler"
