entries:
  - title: "Sunucu Bilgileri"
    content: "İsim: Knight Network | IP: play.knightnw.com | Port: 25565 | Sürüm: 1.21.11 | Tür: Skyblock,Survival,Factions | Dil: Türkçe | Kuruluş: 2018 | Site: https://knightnw.com | Discord: https://discord.gg/knightnw"
  - title: "Sunucu Kuralları"
    content: "Hile, makro ve tüm zararlı yazılımları kullanmak yasaktır. • Bug bildirilmeden kullanmak veya yararlanmak yasaktır. • Sohbette insanları rahatsız edici cümleler kullanmak yasaktır. • TP tuzağı ve dolandırıcılık yasaktır. • Yetkililerle saygısız bir şekilde konuşmak yasaktır. • Her türlü reklam ve bağlantı (link) paylaşımı yasaktır. • Kill kasmak veya kastırmak kesinlikle yasaktır. • Burada yazmayan fakat uyulması gereken görgü kuralları dahildir. • Birden fazla AFK hesap ile reklam yapmak yasaktır. AFK hesaplardan yapılan reklam aralığı 10 dakikadan fazla olmalıdır. • AFK halde kasılmak yasaktır (blok kırmak, balık tutmak vb.). Farm ve spawnerlar için AFK bırakmak serbesttir. • AFK client veya başka bir yazılım ile çiftçiden otomatik satış yapmak yasaktır. • Jackpota birden çok hesapla katılmak yasaktır. • Birden fazla hesap ile sezon sıralamasına girmek yasaktır. • Yan hesaplardan eşya toplamak yasaktır. • Kuralların tamamını okumak için /kurallar yazabilirsiniz. • 2 ay boyunca oyuna girmeyenlerin claimi manuel olarak yetkililer tarafından kaldırılabilir. Lütfen oyuna girmeye özen gösterin. • Bir oyuncuyu rahatsız etmek ve claimini trollemek raide girer ve cezası 2 gün hapis cezasıdır. (Tüm kurallar için /kurallar)"
  - title: "Ekonomi - Genel"
    content: "Para birimi: Coin. Başlangıç bakiyesi: 500."
  - title: "Ekonomi - Para Kazanma Yolları"
    content: "Günlük Ödül: /günlüködül komutunu kullanarak rütbesine göre her 24 saatte bir ödül al; Voting (oy verme): Oyuncu /vote komutuyla sunucuya oy verir ve 50 claim block + 1 adet oy kasası anahtarı kazan; AH satışı: /ah komutu ile eşyalarını satışa koy; Order satışı: /order üzerinden gelen oyuncu siparişlerini tamamlayarak para kazan.; Görev sistemi: /görev komutu ile seçtiğin görevleri tamamlayarak ödül kazan; Günlük görev sistemi: /günlükgörev ile her gün 3 farklı eşya teslimatı görevi yaparak ödül al; Discord Ödül: /discordödül komutu üzerinden Discord hesabını sunucuya bağlayarak veya discord sunucusuna boost basarak çeşitli ödüller kazan; Oy Serisi: /oyver komutu ile her gün oy vererek oy serisinde ilerleyip çeşitli ödüller kazan"
  - title: "Ekonomi - Para Harcama"
    content: "/shop - Ana mağaza, /ah - Açık artırma, /jackpot - Şans oyunları"
